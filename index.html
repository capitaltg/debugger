<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Debugger - JWT &amp; SAML Decoder</title>
    <meta
      name="description"
      content="A free, open-source debugging toolkit for JWT and SAML tokens, URLs, email lists, JSON, XML, and SQL. Everything is decoded in your browser — nothing you paste leaves the page."
    />
    <meta property="og:title" content="Token Debugger - JWT &amp; SAML Decoder" />
    <meta
      property="og:description"
      content="A free, open-source debugging toolkit for JWT and SAML tokens, URLs, email lists, JSON, XML, and SQL. Everything is decoded in your browser — nothing you paste leaves the page."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
